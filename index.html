<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lanista</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lanista">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --ground:#E2DFD8; --bar:#D5D1C6; --raised:#F6F4EF; --sunk:#D9D5CB; --ink:#25211E; --muted:#645D55; --line:#BDB8AC;
  --you:#9B2D26; --on-you:#FFFFFF; --rival:#1F6664; --gold:#8F6410; --good:#2F6B2A; --bad:#9B2D26; --warn:#8A5A00;
  --a-sky:#9DB2C4; --a-stone:#B7A783; --a-stone2:#9C8C69; --a-wall:#A69272; --a-sand:#D3BE92; --a-sand2:#BBA577;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#1B1D21; --bar:#121417; --raised:#25282D; --sunk:#16181B; --ink:#ECE8E0; --muted:#A59E92; --line:#3B3F45;
    --you:#DB5F55; --on-you:#1B0D0C; --rival:#5DB5B1; --gold:#D6A44B; --good:#8BC47F; --bad:#E5776D; --warn:#E0B24F;
    --a-sky:#2B3A4F; --a-stone:#4A4332; --a-stone2:#39332A; --a-wall:#4F4636; --a-sand:#5A4E36; --a-sand2:#473D2A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#1B1D21; --bar:#121417; --raised:#25282D; --sunk:#16181B; --ink:#ECE8E0; --muted:#A59E92; --line:#3B3F45;
  --you:#DB5F55; --on-you:#1B0D0C; --rival:#5DB5B1; --gold:#D6A44B; --good:#8BC47F; --bad:#E5776D; --warn:#E0B24F;
  --a-sky:#2B3A4F; --a-stone:#4A4332; --a-stone2:#39332A; --a-wall:#4F4636; --a-sand:#5A4E36; --a-sand2:#473D2A;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font:17px/1.45 "Alegreya Sans",system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:12;background:var(--bar)}
h1,h2,h3{font-family:Marcellus,Georgia,"Times New Roman",serif;font-weight:400;margin:0;line-height:1.15}
h1{font-size:clamp(38px,11vw,54px)}
h2{font-size:26px;margin-bottom:6px}
h3{font-size:20px}
p{margin:0 0 10px}
.small{font-size:14.5px;color:var(--muted)}
.lede{color:var(--muted);margin-bottom:12px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--bar);border-bottom:1px solid var(--line)}
.bar-in{max-width:580px;margin:0 auto;padding:8px 14px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:15.5px;white-space:nowrap}
.brand{font-family:Marcellus,Georgia,serif;font-size:18px}
.wrap{max-width:580px;margin:0 auto;padding:14px 14px 70px}
.btn{font:inherit;font-weight:700;border:0;border-radius:4px;padding:12px 18px;min-height:46px;background:var(--you);color:var(--on-you);cursor:pointer}
.btn.quiet{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.sm{min-height:40px;padding:8px 12px;font-size:15.5px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.block{display:block;width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
button:focus-visible,[role=button]:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 14px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;margin-bottom:6px}
.chips.scroll .chip{flex:none}
.chip{font:inherit;border:1.5px solid var(--line);background:var(--raised);color:var(--ink);border-radius:20px;padding:7px 14px;cursor:pointer;min-height:40px}
.chip.on{border-color:var(--ink);background:var(--ink);color:var(--ground);font-weight:700}
.chip[disabled]{opacity:.5;cursor:not-allowed}
.notice{background:var(--raised);border-left:5px solid var(--gold);padding:9px 12px;margin:0 0 12px}
.fc{--house:var(--ink);background:var(--raised);border:1px solid var(--line);border-left:5px solid var(--house);padding:10px 12px;margin-bottom:10px;border-radius:2px}
.fc.you{--house:var(--you)} .fc.rival{--house:var(--rival)}
.fh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:4px;flex-wrap:wrap}
.meta{font-size:14.5px;color:var(--muted)}
.st{display:grid;grid-template-columns:84px 1fr;align-items:center;gap:6px;font-size:15.5px;line-height:1.55}
.tiles{display:inline-flex;gap:3px}
.tiles i{display:block;width:16px;height:11px;background:var(--line)}
.tiles i.on{background:var(--house,var(--ink))}
.fc.c .st{grid-template-columns:30px 1fr;font-size:14px;gap:4px}
.fc.c .tiles{gap:2px} .fc.c .tiles i{width:11px;height:9px}
.gear{font-size:15px;margin:6px 0 0}
.grp{margin:14px 0 6px;font-family:Marcellus,Georgia,serif;font-size:19px}
.opts{display:grid;gap:6px}
.opt{font:inherit;display:grid;grid-template-columns:1fr auto;column-gap:10px;text-align:left;border:1.5px solid var(--line);background:var(--raised);color:var(--ink);padding:8px 11px;cursor:pointer;border-radius:3px;min-height:46px;width:100%}
.opt .oname{font-weight:700}
.opt .ometa{grid-column:1;font-size:14px;color:var(--muted)}
.opt .ocost{grid-column:2;grid-row:1 / span 2;align-self:center;font-weight:700;color:var(--gold)}
.opt.on{border-color:var(--you);box-shadow:inset 4px 0 0 var(--you);background:var(--sunk)}
.opt[disabled]{opacity:.45;cursor:not-allowed}
.panel{background:var(--sunk);border-radius:3px;padding:10px 12px;margin:8px 0}
.read{margin:8px 0}
.read p{margin:0 0 5px;font-size:16px}
.v-good{color:var(--good);font-weight:700} .v-bad{color:var(--bad);font-weight:700} .v-mid{color:var(--warn);font-weight:700}
.odds{display:flex;gap:6px;margin:8px 0}
.odds div{flex:1;padding:8px 6px;text-align:center;border-radius:3px;background:var(--sunk);font-size:15px}
.odds b{display:block;font-size:22px;font-family:Marcellus,Georgia,serif;font-weight:400}
.slot{border-top:2px solid var(--line);padding-top:12px;margin-top:14px}
.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.meter{height:9px;background:var(--sunk);border-radius:2px;overflow:hidden;margin-bottom:3px}
.meter>div{height:100%;transition:width .5s}
.hp>div{background:var(--house)}
.sta{height:5px} .sta>div{background:var(--gold)}
.log{max-height:44vh;overflow:auto;margin:10px 0;padding:4px 0;border-top:1px solid var(--line)}
.ln{padding:4px 8px;margin:3px 0;border-left:4px solid var(--line);font-size:16px}
.ln.i0{border-left-color:var(--you)} .ln.i1{border-left-color:var(--rival)}
.ln.hit{font-weight:500}
.ln.hdr{border:0;font-family:Marcellus,Georgia,serif;color:var(--muted);margin-top:10px;padding-left:0}
.res{border:2px solid var(--ink);padding:12px 14px;margin:12px 0;border-radius:3px;background:var(--raised)}
.res.win{border-color:var(--good)} .res.lose{border-color:var(--bad)}
.res h3{margin-bottom:4px}
.res p{margin:0 0 4px}
.lock{opacity:.6}
.scene{display:block;width:100%;height:auto;border-radius:3px;background:var(--a-sky)}
.a-sky{fill:var(--a-sky)} .a-stone{fill:var(--a-stone)} .a-stone2{fill:var(--a-stone2)} .a-wall{fill:var(--a-wall)} .a-sand{fill:var(--a-sand)} .a-sand2{fill:var(--a-sand2)}
.cap{min-height:3em;margin:6px 0 4px;font-size:17px}
.watch .log{display:none}
.read .scene,.read .cap{display:none}
/* ---- torchlit look for the stable screens ---- */
.bar{background:linear-gradient(#604A35,#3A2A1D);border-bottom:0;box-shadow:0 2px 0 #1C130D}
.bar::after{content:"";display:block;height:6px;background:conic-gradient(#1F6664 25%,#C9A14A 0 50%,#1F6664 0 75%,#C9A14A 0) 0 0/12px 12px}
body::before{background:#604A35}
.bar-in{padding:6px 10px;gap:8px;align-items:center;justify-content:space-between}
.brand{color:#F3E7CF}
.pl{display:flex;align-items:center;gap:6px;background:#231A13;border:2px solid #8D6D3B;border-radius:6px;padding:3px 10px;color:#F3E7CF;font-weight:700;font-size:17px;min-width:0}
.pl svg{width:22px;height:22px;flex:none}
body.torch{--ground:#1D1510;--ink:#F0E6D2;--muted:#BCAE96;--line:#4B3C30;color:var(--ink)}
body.torch .wrap{padding-bottom:118px}
.torch .fc,.torch .panel,.torch .notice,.torch .gc{--ink:#2A211B;--muted:#695B4B;--line:#C4B79F;--raised:#EEE4D0;--sunk:#DDD0B8;--gold:#8F6410;color:var(--ink)}
.torch .fc,.torch .gc,.torch .notice{background:linear-gradient(#F0E7D4,#E4D8BF);border:2px solid #5A4A3A;border-radius:6px;box-shadow:0 2px 0 rgba(0,0,0,.45)}
.torch .fc{border-left-width:6px}
.torch .fc.you{border-left-color:var(--you)} .torch .fc.rival{border-left-color:var(--rival)}
.torch .panel{background:#DDD0B8}
.torch .chip{background:#E5DAC3;color:#2A211B;border:2px solid #5A4A3A}
.torch .chip.on{background:#9B2D26;color:#fff;border-color:#2A1A12}
.torch .chip[disabled]{opacity:.55}
.plaque{width:72%;margin:0 auto 12px;text-align:center;background:linear-gradient(#F0E7D4,#D9CCB1);border:2px solid #5A4A3A;border-radius:6px 6px 28px 28px;box-shadow:0 3px 0 rgba(0,0,0,.5);padding:4px 0 6px}
.plaque h1{color:#3A2F27;font-size:clamp(30px,9vw,40px);letter-spacing:.06em}
.banner{position:relative;background:linear-gradient(#EDE3CD,#D9CCB1);color:#2A211B;text-align:center;font-family:Marcellus,Georgia,serif;font-size:21px;letter-spacing:.05em;padding:8px 44px;border:2px solid #5A4A3A;margin:4px 0 10px;box-shadow:0 2px 0 rgba(0,0,0,.45)}
.banner::before,.banner::after{content:"";position:absolute;top:5px;width:30px;height:30px;background:conic-gradient(#9B2D26 25%,#C9A14A 0 50%,#1F6664 0 75%,#E8DDC7 0) 0 0/15px 15px;border:2px solid #5A4A3A}
.banner::before{left:6px} .banner::after{right:6px}
.gc{display:grid;grid-template-columns:104px minmax(0,1fr) 78px;gap:6px 10px;padding:10px;margin-bottom:12px;align-items:start}
.gp{grid-row:1 / span 2;align-self:stretch}
.mos{padding:5px;height:100%;min-height:124px;background:conic-gradient(#1F6664 25%,#C9A14A 0 50%,#1F6664 0 75%,#C9A14A 0) 0 0/10px 10px;border:2px solid #2A211B}
.mos svg{display:block;width:100%;height:100%;min-height:112px}
.gi h3{font-size:23px;line-height:1.05}
.role{font-size:13.5px;color:var(--muted);margin:1px 0 4px}
.sr{display:grid;grid-template-columns:62px 1fr;align-items:center;font-size:13px;line-height:1.7}
.tl{display:inline-flex;gap:2px}
.tl i{display:block;width:11px;height:12px;background:#3A322D;border:1px solid #1C130D}
.tl i.on.s{background:#C2372E} .tl i.on.p{background:#2A8A86} .tl i.on.a{background:#D9A431}
.ga{align-self:center;text-align:center}
.bz{font:inherit;font-weight:700;font-size:15px;letter-spacing:.04em;width:100%;min-height:50px;padding:6px 4px;color:#2A1A08;cursor:pointer;background:linear-gradient(#E3B467,#B97C32);border:2px solid #6B4318;border-radius:6px;box-shadow:inset 0 1px 0 #F6D79A,0 2px 0 rgba(0,0,0,.5)}
.bz.gold{font-size:20px;min-height:58px;letter-spacing:.08em}
.bz[disabled]{opacity:.5;cursor:not-allowed}
.bz small{display:block;font-size:12.5px;font-weight:700}
.gf{grid-column:2 / 4;display:flex;align-items:center;justify-content:space-between;gap:8px}
.rib{flex:1;min-width:0;font-size:13px;text-align:center;padding:4px 12px;background:#E0D2B5;border-top:1.5px solid #8A765A;border-bottom:1.5px solid #8A765A;clip-path:polygon(0 0,100% 0,96% 50%,100% 100%,0 100%,4% 50%);line-height:1.2}
.rec{font-weight:700;font-size:15px;white-space:nowrap}
.gm{grid-column:1 / -1}
.pur{font-family:Marcellus,Georgia,serif;font-size:24px;line-height:1.05}
.pur small{display:block;font-family:"Alegreya Sans",system-ui,sans-serif;font-size:12.5px;color:var(--muted)}
.nav{display:none;position:fixed;left:0;right:0;bottom:0;z-index:11;background:#2A1F18;box-shadow:0 -2px 0 #1C130D;padding:0 8px calc(env(safe-area-inset-bottom,0px) + 8px)}
.nav::before{content:"";display:block;height:6px;margin:0 -8px 8px;background:conic-gradient(#1F6664 25%,#C9A14A 0 50%,#1F6664 0 75%,#C9A14A 0) 0 0/12px 12px}
body.torch .nav{display:block}
.nav-in{max-width:580px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.nv{font:inherit;font-weight:700;font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:64px;padding:4px 2px;background:#DBCFB7;color:#2A211B;border:2px solid #5A4A3A;border-radius:6px;cursor:pointer}
.nv.on{background:#9B2D26;color:#fff;border-color:#1F120C}
.nv svg{width:30px;height:30px}
.mos img{display:block;width:100%;height:100%;min-height:112px;object-fit:cover;object-position:50% 14%}
.tc{display:grid;grid-template-columns:92px minmax(0,1fr);gap:10px;align-items:start}
.tm{min-height:0;height:auto;aspect-ratio:1/1;padding:4px}
.tm img{min-height:0;height:100%}
.advp{display:flex;gap:10px;align-items:flex-start}
.advt{flex:1;min-width:0}
.tav{width:56px;height:56px;flex:none;object-fit:cover;object-position:50% 14%;background:#1F6664;border:2px solid #2A211B;border-radius:6px}
.who{display:flex;align-items:center;gap:8px}
.av2,.av{width:42px;height:42px;object-fit:cover;object-position:50% 14%;background:#1F6664;border:2px solid #2A211B;border-radius:6px;flex:none}
.opt.hasav{grid-template-columns:48px 1fr auto}
.opt.hasav .av{grid-column:1;grid-row:1 / span 3;align-self:center}
.opt.hasav .oname{grid-column:2;grid-row:1}
.opt.hasav .ometa{grid-column:2}
.opt.hasav .ocost{grid-column:3;grid-row:1 / span 3}
.bar-in{padding:5px 10px 7px;gap:5px 8px;display:grid;grid-template-columns:repeat(3,auto);justify-content:space-between;align-items:center}
.badge{grid-column:1 / -1;justify-self:center;background:linear-gradient(#F0E7D4,#D9CCB1);border:2px solid #5A4A3A;border-radius:4px 4px 14px 14px;padding:0 26px;font-family:Marcellus,Georgia,serif;font-size:19px;letter-spacing:.1em;line-height:1.4;color:#3A2F27;box-shadow:0 2px 0 rgba(0,0,0,.5)}
.nav{padding:0 0 env(safe-area-inset-bottom,0px);background:#1D1510;box-shadow:0 -2px 0 #1C130D}
.nav::before{display:none}
.nbar{position:relative;width:100%;max-width:580px;margin:0 auto;background-size:100% 100%;background-repeat:no-repeat}
.nt{position:absolute;padding:0;border:0;background:none;cursor:pointer;font:inherit}
.nt img{display:block;width:100%;height:100%}
.nt span{position:absolute;left:0;right:0;bottom:5%;text-align:center;font-weight:700;font-size:clamp(10.5px,3.1vw,14px);line-height:1;color:#2A211B;pointer-events:none}
.nt.on span{color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.45)}
.nt.on::after{content:"";position:absolute;inset:3%;border:2px solid #D6A44B;border-radius:6px;pointer-events:none}
.nt:focus-visible{outline:3px solid #D6A44B;outline-offset:1px}
body.torch .wrap{padding-bottom:150px}
/* ---- torchlit wall ---- */
body.torch{background:#1D1510}
#bg{display:none;position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
body.torch #bg{display:block}
.wall{position:absolute;inset:0;background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%27184%27%20height%3D%2792%27%3E%3Crect%20width%3D%27184%27%20height%3D%2792%27%20fill%3D%27%23241912%27/%3E%3Cg%20stroke%3D%27%2315100b%27%20stroke-width%3D%273%27%3E%3Crect%20x%3D%271.5%27%20y%3D%271.5%27%20width%3D%2789%27%20height%3D%2743%27%20fill%3D%27%232c2019%27/%3E%3Crect%20x%3D%2793.5%27%20y%3D%271.5%27%20width%3D%2789%27%20height%3D%2743%27%20fill%3D%27%23291d16%27/%3E%3Crect%20x%3D%27-44.5%27%20y%3D%2747.5%27%20width%3D%2789%27%20height%3D%2743%27%20fill%3D%27%23271b14%27/%3E%3Crect%20x%3D%2747.5%27%20y%3D%2747.5%27%20width%3D%2789%27%20height%3D%2743%27%20fill%3D%27%232e2219%27/%3E%3Crect%20x%3D%27139.5%27%20y%3D%2747.5%27%20width%3D%2789%27%20height%3D%2743%27%20fill%3D%27%23271b14%27/%3E%3C/g%3E%3C/svg%3E") 0 0/184px 92px;opacity:.85}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 35%,rgba(0,0,0,.7) 100%)}
.torchw{position:absolute;top:30vh;width:64px;height:176px}
.torchw.l{left:-27px}
.torchw.r{right:-27px;transform:scaleX(-1)}
.torchw svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.gl{position:absolute;left:50%;top:6%;width:380px;height:380px;margin:-190px 0 0 -190px;border-radius:50%;background:radial-gradient(circle,rgba(255,165,64,.42),rgba(255,120,30,.14) 45%,transparent 68%);animation:glow 2.3s ease-in-out infinite alternate}
.torchw.r .gl{animation-duration:1.9s;animation-delay:-.7s}
.fl{transform-box:fill-box;transform-origin:50% 100%;animation:flick 1.1s ease-in-out infinite}
.fl.m{animation-duration:.8s;animation-delay:-.3s}
.fl.i{animation-duration:.6s;animation-delay:-.2s}
.torchw.r .fl{animation-delay:-.5s}
@keyframes flick{0%{transform:scale(1,1) skewX(0)}25%{transform:scale(1.06,1.1) skewX(3deg)}50%{transform:scale(.95,.94) skewX(-2deg)}75%{transform:scale(1.03,1.12) skewX(2deg)}100%{transform:scale(1,1) skewX(0)}}
@keyframes glow{from{opacity:.72;transform:scale(.96)}to{opacity:1;transform:scale(1.04)}}
.em{position:absolute;bottom:-12px;border-radius:50%;background:#FFB347;box-shadow:0 0 6px 2px rgba(255,140,40,.65);opacity:0;animation:rise linear infinite}
@keyframes rise{0%{transform:translate(0,0);opacity:0}8%{opacity:.95}100%{transform:translate(var(--dx),-112vh);opacity:0}}
.torch .wrap{padding-left:24px;padding-right:24px}
.gc{grid-template-columns:98px minmax(0,1fr) 74px}
@media (prefers-reduced-motion: reduce){.fl,.gl{animation:none}.em{display:none}}
/* ---- victory popup ---- */
.mback{position:fixed;inset:0;z-index:30;background:rgba(10,6,4,.72);animation:fadein .25s ease-out}
.mcard{--ink:#2A211B;--muted:#695B4B;--line:#C4B79F;--gold:#8F6410;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:31;width:min(92vw,360px);padding:30px 16px 16px;color:var(--ink);background:linear-gradient(#F2E9D6,#E3D6BC);border:2px solid #5A4A3A;border-radius:8px;box-shadow:0 0 0 3px #C9A14A,0 14px 40px rgba(0,0,0,.65);animation:pop .32s cubic-bezier(.2,.9,.3,1.2)}
.mcard::before{content:"";position:absolute;left:0;right:0;top:0;height:8px;background:conic-gradient(#1F6664 25%,#C9A14A 0 50%,#1F6664 0 75%,#C9A14A 0) 0 0/16px 16px;border-radius:6px 6px 0 0}
.mrib{position:absolute;top:-20px;left:50%;transform:translateX(-50%);background:#9B2D26;color:#F6E7BF;font-family:Marcellus,Georgia,serif;letter-spacing:.14em;font-size:22px;padding:5px 30px;border:2px solid #4D130F;border-radius:3px;box-shadow:0 2px 0 rgba(0,0,0,.5);white-space:nowrap}
.mhead{display:flex;gap:12px;align-items:center;margin:6px 0 12px}
.mbody{max-height:calc(86vh - 50px);overflow:auto}
.mport{width:72px;height:72px;flex:none;object-fit:cover;object-position:50% 14%;border:3px solid #2A211B;border-radius:6px;background:#1F6664;box-shadow:0 0 0 2px #C9A14A}
.mhead h3{font-size:23px;line-height:1.1}
.msub{margin:3px 0 0;color:var(--muted);font-size:15.5px}
.mrow{display:flex;align-items:center;gap:10px;background:#E0D3B8;border:1.5px solid #B9A987;border-radius:6px;padding:8px 12px;margin-bottom:8px}
.mrow svg{width:30px;height:30px;flex:none}
.mrow b{font-family:Marcellus,Georgia,serif;font-weight:400;font-size:30px;line-height:1;min-width:76px}
.mrow span{font-size:14.5px;color:var(--muted);line-height:1.2}
.mtot{margin:4px 0 12px;text-align:center;font-weight:700}
.mcard .notice{margin:0 0 12px;font-size:15px}
@keyframes pop{from{transform:translate(-50%,-46%) scale(.9);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion: reduce){.mcard,.mback{animation:none}}
@media (prefers-reduced-motion: reduce){.meter>div{transition:none}}
</style>

var PRON_M={he:'he',He:'He',his:'his',His:'His',him:'him',hes:'he’s',Hes:'He’s'},PRON_F={he:'she',He:'She',his:'her',His:'Her',him:'her',hes:'she’s',Hes:'She’s'};
function PR(f){return f&&f.g==='f'?PRON_F:PRON_M}
var NAMES_F=['Lucia','Livia','Aurelia','Cornelia','Flavia','Julia','Valeria','Sabina','Camilla','Drusilla','Octavia','Tullia'];
var NAMES=['Brutus','Cassian','Decimus','Flavian','Gaius','Lucan','Marcellus','Octavian','Rufus','Titus','Varro','Vitalis','Aelius','Corvus','Drusus','Felix','Lentulus','Maximus','Nerva','Quintus','Sextus','Tiberius','Urbanus','Valens'];

/* ---------- fight simulation ---------- */
var ROUND_LIMIT=10;
function kitStats(g,f){
  var a=ARMOR[g.armor],w=WEAPON[g.weapon],sh=SHIELD[g.shield];
  var weight=a.w+w.w+sh.w,over=Math.max(0,weight-f.str);
  return {prot:{s:a.s,p:a.p,b:a.b},w:weight,over:over,speedPen:Math.floor(over/2),staMult:1+.1*over,block:sh.b,main:w,brittle:false};
}
function mk(f,k){
  var ks=kitStats(k,f),hp=12+f.tou*3,sta=10+f.end*3;
  return {f:f,k:k,ks:ks,hp:hp,maxHp:hp,sta:sta,maxSta:sta,wear:0,stun:0,exh:false,exhRound:0,dealt:0,hits:0};
}
function simulate(fa,ka,fb,kb,wantLog){
  var C=[mk(fa,ka),mk(fb,kb)],out={winner:-1,rounds:0,log:wantLog?[]:null,C:C};
  function snap(){return {hp:[Math.max(0,C[0].hp),Math.max(0,C[1].hp)],sta:[Math.round(C[0].sta),Math.round(C[1].sta)]}}
  function L(r,i,text,extra){if(wantLog)out.log.push(Object.assign({r:r,i:i,text:text},snap(),extra||{}))}
  function spdE(c){return Math.max(1,c.f.spd-c.ks.speedPen-(c.exh?2:0))}
  function accE(c){return Math.max(1,c.f.acc-(c.exh?2:0))}
  function eff(c,t){return Math.max(0,c.ks.prot[t]-Math.min(3,Math.floor(c.wear)))}
  function strike(a,ai,d,w,r){
    var nm=a.f.name,dn=d.f.name,wn=w.n.toLowerCase();
    a.sta=Math.max(0,a.sta-Math.max(1,Math.round(w.st*a.ks.staMult)));
    var acc=accE(a);
    var p=clamp(.58+.04*(acc-spdE(d))+(w.acc||0),.15,.92);
    if(rnd()>=p){L(r,ai,pick([nm+' swings the '+wn+' and misses.',dn+' slips away from the '+wn+'.',nm+' lunges, and finds only air.']),{ev:'miss'});return}
    var blk=d.ks.block;if(w.hook)blk*=.5;
    if(blk>0&&rnd()<blk){L(r,ai,dn+' catches the '+wn+' on the shield.',{ev:'block'});return}
    var tk=w.t[0],armor=eff(d,tk);
    var weak=rnd()<(.04+.025*acc+(w.weak||0));
    if(weak)armor*=.5;
    var dmg=(w.d+Math.floor(a.f.str/2))*(1-armor*.06)*(.85+rnd()*.3);
    if(a.exh)dmg*=.85;

    d.hp-=dmg;a.dealt+=dmg;a.hits++;
    var before=Math.floor(d.wear);
    d.wear+=.25;
    var verb={pierce:['drives the '+wn+' into','thrusts the '+wn+' at','stabs'],slash:['slashes','cuts across','opens a gash on'],blunt:['hammers','smashes the '+wn+' into','cracks']}[w.t];
    var txt=nm+' '+pick(verb)+' '+dn+' for '+dmg+'.';
    if(weak)txt+=' It finds a gap in the armor.';
    else if(lucky)txt+=' A lucky blow!';
    else if(armor>=5&&dmg<=3)txt+=' The armor takes most of it.';
    if(Math.floor(d.wear)>before&&d.ks.prot[tk]>0)txt+=' '+dn+'’s armor is wearing down.';
    L(r,ai,txt,{hit:true,dmg:dmg,ev:'hit',weak:weak,lucky:lucky});
    if(w.trip&&d.hp>0&&rnd()<.15){d.stun=1;L(r,ai,dn+' is knocked off balance.',{ev:'stun',who:1-ai})}
  }
  function act(a,ai,d,r){
    if(a.stun>0){a.stun--;L(r,ai,a.f.name+' is still reeling.',{ev:'stun',who:ai});return}
    if(rnd()<.03){a.sta=Math.max(0,a.sta-1);L(r,ai,a.f.name+' slips on the sand and loses the moment.',{ev:'slip'});return}
    strike(a,ai,d,a.ks.main,r);
  }
  for(var r=1;r<=ROUND_LIMIT&&out.winner<0;r++){
    out.rounds=r;
    L(r,-1,'Round '+r,{hdr:true});
    for(var i=0;i<2;i++){var c=C[i];c.exh=c.sta<c.maxSta*.3;if(c.exh&&!c.exhRound){c.exhRound=r;L(r,i,c.f.name+' is winded and slowing.',{ev:'winded'})}}
    var ini=[0,1].map(function(i){var c=C[i],o=C[1-i];return spdE(c)+c.ks.main.s*.5+rnd()*4+clamp(c.ks.main.r-o.ks.main.r,-2,2)*.5});
    var order=ini[0]>=ini[1]?[0,1]:[1,0];

      if(d.hp<=0){out.winner=ai;break}
    }
    C.forEach(function(c){c.sta=Math.min(c.maxSta,c.sta+1)});
  }
  return out;
}

function genBars(T){

    if(ch<0)for(var k=0;k<3;k++)if(s[k]<CFG.maxBars){ch=k;break}

function equip(f,slot,item){

/* ---------- trainer's planner (works on copies, never touches the real stable) ---------- */
function pTrainCost(f,st,T){if(f[st]>=Math.min(CFG.maxBars,T.cap)||total(f)>=f.ceil)return -1;return trainCost(f)}
function pEquipCost(f,slot,item){
  var tbl=TBL[slot];

  if(slot==='shield'&&item!=='none'&&WEAPON[f.gear.weapon].two)return null;
  var c=tbl[item].c-Math.floor(tbl[f.gear[slot]].c/2);
  if(slot==='weapon'&&WEAPON[item].two&&f.gear.shield!=='none')c-=Math.floor(SHIELD[f.gear.shield].c/2);

}
function pEquip(f,slot,item){f.gear[slot]=item;if(slot==='weapon'&&WEAPON[item].two)f.gear.shield='none'}
function reasonFor(b,f,opp){
  var ow=WEAPON[opp.gear.weapon],oa=ARMOR[opp.gear.armor],pf=PR(f),po=PR(opp);
  if(b.kind==='train')return {str:'harder hits, and '+pf.he+' can carry heavier gear',spd:pf.he+' strikes first and is harder to hit',acc:pf.he+' lands more blows and finds gaps in armor'}[b.a];
  if(b.a==='armor'){var x=ARMOR[b.b];return po.his+' '+ow.n.toLowerCase()+' does '+ow.t+' damage, and '+(b.b==='none'?'going without armor':x.n.toLowerCase())+' gives '+x[ow.t[0]]+' against it'+(x.w<ARMOR[f.gear.armor].w?', and it keeps '+pf.him+' lighter':'')}
  if(b.a==='weapon'){var w=WEAPON[b.b];return 'it does '+w.t+' damage, and '+(opp.gear.armor==='none'?po.he+' wears no armor':po.his+' '+oa.n.toLowerCase()+' gives '+oa[w.t[0]]+' against it')}
  return b.b==='none'?'dropping the shield makes '+pf.him+' lighter':'a '+SHIELD[b.b].n.toLowerCase()+' blocks some of '+po.his+' blows';
}
function planFor(f0,opp,budget,T){
  var f=clone(f0),steps=[],spent=0,cur=odds(f,opp,T.N).w,start=cur;
  for(var k=0;k<T.steps;k++){
    var best=null,left=budget-spent;
    var tryC=function(kind,a,b,cost){
      if(cost>left)return;
      var g=clone(f);
      if(kind==='train'){g[a]++;g.base+=cost}else pEquip(g,a,b);
      var w=odds(g,opp,T.N).w,gain=w-cur;
      if(gain<T.min)return;
      var eff=gain/Math.max(cost,8);
      if(!best||eff>best.eff)best={kind:kind,a:a,b:b,cost:cost,w:w,g:g,eff:eff};
    };
    STATS.forEach(function(st){var c=pTrainCost(f,st[0],T);if(c>=0)tryC('train',st[0],null,c)});
    Object.keys(TBL).forEach(function(slot){Object.keys(TBL[slot]).forEach(function(it){var c=pEquipCost(f,slot,it);if(c!==null)tryC('gear',slot,it,c)})});
    if(!best)break;

  var pick=null;

function favorCost(){return G.prep.mode==='final'?EMP.favor:ARENAS[G.prep.arena].favor}
function readout(f,opp,od){
  var me=kitStats(f.gear,simF(f)),th=kitStats(opp.gear,simF(opp)),h='<div class="read">';

  var mw=WEAPON[f.gear.weapon],t2=mw.t,p2=th.prot[t2[0]];
  h+='<p>Your '+mw.n.toLowerCase()+' does <b>'+t2+'</b> damage. Their armor gives '+p2+' against it: '+(p2<=2?'<span class="v-good">they’re exposed</span>':(p2<=5?'<span class="v-mid">fair</span>':'<span class="v-bad">it’s tough going</span>'))+'.</p>';
  h+='<p>'+overText(me.over,f)+' Carrying '+me.w+' against '+(f.str*2)+'.</p>';

    var taken=P.slots.some(function(o,j){return j!==i&&o.sel===f.id});

async function swing(e){

/* settle a battle: pure game logic, returns result lines */
function settle(ctx,P,out){
  var f=ctx.f,lines=[],head='',cls='',kind,fate=null,reward=null;
  var won=out.winner===0,lost=out.winner===1,draw=out.winner<0;
  var favorWin=draw&&ctx.favor;
  G.fights++;
  if(won||favorWin){
    kind='win';f.wins++;
    head=favorWin?'A draw, and the crowd backs you':f.name+' wins';
    cls='win';
    if(favorWin)lines.push('Both fighters were standing after '+ROUND_LIMIT+' rounds. Your favor tips it to '+f.name+'.');
    else lines.push(ctx.opp.name+' falls in round '+out.rounds+'.');
    if(P.mode==='contract'){
      var gain=repGain(P.contract,P.arena);
      var wage=TRAINERS[G.trainer].wage;
      G.coin+=P.contract.purse-wage;G.rep+=gain;G.arenaWins[P.arena]=(G.arenaWins[P.arena]||0)+1;
      reward={purse:P.contract.purse,wage:wage,rep:gain};
      lines.push('Purse +'+P.contract.purse+'c'+(wage?' (trainer’s wage −'+wage+'c)':'')+'. Reputation +'+gain+'.');
    }else P.score[0]++;
  }else if(lost){
    kind='loss';cls='lose';f.losses=(f.losses||0)+1;
    if(P.mode==='contract')G.rep=Math.max(0,G.rep-CFG.loseRep);else P.score[1]++;
    fate=ctx.favor?'spared':'dead';
    if(ctx.favor){
      head=f.name+' is beaten, but spared';
      lines.push('The crowd calls for mercy. '+PR(f).He+' lives, and keeps '+PR(f).his+' training and gear.');
    }else{
      head=f.name+' is dead';
      lines.push('You lose '+PR(f).him+' and the '+worth(f)+'c you put into him.');
      G.stable=G.stable.filter(function(x){return x!==f});
    }
    if(P.mode==='contract')lines.push('Reputation −'+CFG.loseRep+'.');
  }else{
    kind='draw';head='A draw';f.draws=(f.draws||0)+1;
    lines.push('Both fighters were standing after '+ROUND_LIMIT+' rounds. With no favor, nothing is earned and nothing is lost.');
  }
  return {head:head,cls:cls,lines:lines,kind:kind,fate:fate,reward:reward};
}
function finishBattle(out){
  var c=G.ctx,P=G.prep,r=settle(c,P,out);
  var C=out.C,facts=[];
  facts.push(esc(C[0].f.name)+' dealt '+C[0].dealt+' damage in '+C[0].hits+' hits. '+esc(C[1].f.name)+' dealt '+C[1].dealt+' in '+C[1].hits+'.');
  [0,1].forEach(function(i){if(C[i].exhRound)facts.push(esc(C[i].f.name)+' ran out of breath in round '+C[i].exhRound+'.')});
  var btn;
  if(P.mode==='contract'){
    refreshAfterFight(P.arena);
    if(checkOver()){btn='<button class="btn block" data-a="end">Continue</button>'}
    else btn='<button class="btn block" data-a="done">Return to the stable</button>';
  }else{
    if(P.score[0]>=2)btn='<button class="btn block" data-a="victory">Claim the victory</button>';
    else if(P.score[1]>=2||P.idx>=2)btn='<button class="btn block" data-a="defeat">Face the emperor</button>';
    else btn='<button class="btn block" data-a="nextb">Next fight</button>';
    r.lines.push('Score: you '+P.score[0]+', the emperor '+P.score[1]+'.');
  }
  var el=$('#after');
  if(el){el.innerHTML='<div class="res '+r.cls+'"><h3>'+esc(r.head)+'</h3>'+r.lines.map(function(l){return '<p>'+esc(l)+'</p>'}).join('')+'</div><p class="small">'+facts.join(' ')+'</p>'+btn;el.scrollIntoView({behavior:'smooth',block:'nearest'})}
  var sk=document.querySelector('[data-a="skip"]');if(sk)sk.style.display='none';
  renderBar();
  if(G.watch)endAnim(out,r);
  if(r.kind==='win')setTimeout(function(){if(G.phase==='fight'&&G.ctx===c)showWin(r,c,P)},(G.watch&&!SKIP)?1300:350);
}
function showWin(r,c,P){
  var f=c.f,rw=r.reward,laurel=ICO.laurel.replace('#8DC27A','#3F7A33');
  var h='<div class="mback" data-a="mclose"></div><div class="mcard" role="dialog" aria-modal="true" aria-labelledby="mt"><div class="mrib">VICTORY</div><div class="mbody">';
  h+='<div class="mhead">'+((f.face!==undefined&&PORT.faces[f.face])?'<img class="mport" src="'+PORT.faces[f.face].src+'" alt="">':'')+'<div><h3 id="mt">'+esc(r.head)+'</h3><p class="msub">'+esc(r.lines[0])+'</p></div></div>';
  if(rw){
    h+='<div class="mrow">'+ICO.coin+'<b>+'+(rw.purse-rw.wage)+'c</b><span>Coin earned<br>Purse '+rw.purse+'c'+(rw.wage?' − trainer’s wage '+rw.wage+'c':'')+'</span></div>';
    h+='<div class="mrow">'+laurel+'<b>+'+rw.rep+'</b><span>Reputation earned</span></div>';
    h+='<p class="mtot">You now have '+G.coin+'c and '+G.rep+' reputation.</p>';
    if(G.notice)h+='<div class="notice">'+esc(G.notice)+'</div>';
  }else if(P.mode==='final'){
    h+='<p class="mtot" style="margin-top:12px">Score: you '+P.score[0]+', the emperor '+P.score[1]+'.</p>';
  }
  h+='<button class="btn block" data-a="mclose">Continue</button></div></div>';
  var m=$('#modal');if(!m)return;
  m.innerHTML=h;
  var b=m.querySelector('button[data-a="mclose"]');if(b&&b.focus)b.focus();
}
function closeWin(){
  var m=$('#modal');if(m)m.innerHTML='';
  var a=$('#after');if(a&&a.scrollIntoView)a.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function startBattle(){
  var P=G.prep,s=P.slots[P.idx],f=byId(s.sel),cost=s.favor?favorCost():0;
  G.coin-=cost;
  G.phase='fight';G.ctx={f:f,opp:s.opp,favor:s.favor};
  render();runFight();
}
function viewEnd(){
  if(G.over==='victory')return '<h1>Victory</h1><p class="lede">The emperor rises. The Colosseum roars your name.</p><p>You started with three poor fighters and finished as the lanista who won the Emperor’s Games.</p><p class="meta">Fights fought: '+G.fights+' · Reputation: '+G.rep+' · Coin: '+G.coin+'</p><button class="btn" data-a="new">Start a new stable</button>';
  if(G.over==='defeat')return '<h1>Defeat</h1><p class="lede">The emperor’s champions were too strong.</p><p>Your name will not be remembered in the sand of the Colosseum.</p><p class="meta">Fights fought: '+G.fights+' · Reputation: '+G.rep+'</p><button class="btn" data-a="new">Start a new stable</button>';
  return '<h1>Ruined</h1><p class="lede">Your stable is empty, and you can’t afford another fighter.</p><p>Every lanista has a story like this one.</p><p class="meta">Fights fought: '+G.fights+' · Reputation: '+G.rep+'</p><button class="btn" data-a="new">Start a new stable</button>';
}

/* ---------- render & events ---------- */
function render(keep){
  initBg();
  var md=$('#modal');if(md)md.innerHTML='';
  var y=window.scrollY||0,m=$('#main'),h;
  if(!G)h=viewTitle();
  else if(G.phase==='hub')h=viewHub();
  else if(G.phase==='prep')h=viewPrep();
  else if(G.phase==='fight')h=viewFight();
  else h=viewEnd();
  m.innerHTML=h;
  var hub=!!(G&&G.phase==='hub');
  document.body.className=hub?'torch':'';
  var nv=$('#nav');if(nv)nv.innerHTML=hub?navHTML():'';
  renderBar();
  window.scrollTo(0,keep?y:0);
}
function openPrep(mode,arena,contract){
  var P={mode:mode,arena:arena,contract:contract,slots:[],open:null,idx:0,score:[0,0]};
  if(mode==='contract')P.slots=[{opp:contract.opp,sel:null,favor:false,dangerous:!!contract.d}];
  else for(var i=0;i<3;i++)P.slots.push({opp:genOpponent(9,CFG.champBars),sel:null,favor:false});
  G.prep=P;G.phase='prep';G.notice='';render();
}
function handle(el){
  var a=el.dataset.a,d=el.dataset;
  switch(a){
    case 'new':newGame();render();break;
    case 'tab':G.tab=d.v;render(true);break;
    case 'arena':G.arena=+d.i;if(G.arena===4)G.tab='contracts';render(true);break;
    case 'open':G.open=(G.open===+d.f)?null:+d.f;G.confirm=null;render(true);break;
    case 'gtog':G.gopen[d.v]=!G.gopen[d.v];render(true);break;
    case 'train':train(byId(+d.f),d.st);render(true);break;
    case 'gear':if(equip(byId(+d.f),d.slot,d.v))G.gopen[d.slot]=false;render(true);break;
    case 'sell':
      var f=byId(+d.f);
      if(G.confirm===f.id){sell(f);G.confirm=null;if(G.open===f.id)G.open=null;checkOver()}else G.confirm=f.id;
      if(G.phase==='over')render();else render(true);break;
    case 'buy':buy(Math.min(G.arena,3),+d.i);render(true);break;
    case 'take':openPrep('contract',G.arena,G.contracts[G.arena][+d.i]);break;
    case 'emperor':openPrep('final',4,null);break;
    case 'back':G.phase='hub';G.prep=null;render();break;
    case 'pickf':
      var sl=G.prep.slots[+d.slot];sl.sel=+d.f;
      if(sl.adv&&sl.adv!=='busy'){var pi=+d.slot,kept=sl.adv.pick;sl.adv='busy';render(true);setTimeout(function(){if(!G.prep)return;G.prep.slots[pi].adv=advise(pi,kept);render(true)},30)}
      else render(true);break;
    case 'popen':G.prep.open=(G.prep.open===+d.slot)?null:+d.slot;render(true);break;
    case 'favor':G.prep.slots[+d.slot].favor=!G.prep.slots[+d.slot].favor;render(true);break;
    case 'hire':hire(+d.i);render(true);break;
    case 'advise':
      var si=+d.slot;G.prep.slots[si].adv='busy';render(true);
      setTimeout(function(){if(!G.prep)return;G.prep.slots[si].adv=advise(si);render(true)},30);break;
    case 'apply':applyAdvice(+d.slot,d.v);render(true);break;
    case 'go':G.prep.idx=0;G.prep.score=[0,0];startBattle();break;
    case 'nextb':G.prep.idx++;startBattle();break;
    case 'skip':SKIP=true;break;
    case 'mclose':closeWin();break;
    case 'view':G.watch=d.v==='1';saveWatch(G.watch);var fx=$('#fx');if(fx){fx.className=G.watch?'watch':'read';if(G.watch&&!VZ&&$('#fg0'))initViz()}document.querySelectorAll('[data-a="view"]').forEach(function(b){b.classList.toggle('on',(b.dataset.v==='1')===G.watch)});break;
    case 'done':G.phase='hub';G.prep=null;G.tab='stable';render();break;
    case 'end':G.phase='over';render();break;
    case 'victory':G.phase='over';G.over='victory';render();break;
    case 'defeat':G.phase='over';G.over='defeat';render();break;
  }
}
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-a]');
  if(!el||el.disabled)return;
  handle(el);
});
render();
window.__GL={TRAINERS:TRAINERS,hire:hire,advise:advise,planFor:planFor,applyAdvice:applyAdvice,CFG:CFG,ARENAS:ARENAS,ARMOR:ARMOR,SHIELD:SHIELD,WEAPON:WEAPON,EMP:EMP,newGame:newGame,get:function(){return G},odds:odds,train:train,equip:equip,buy:buy,sell:sell,trainCost:trainCost,total:total,genContracts:genContracts,genOpponent:genOpponent,simulate:simulate,simF:simF,settle:settle,refreshAfterFight:refreshAfterFight,checkOver:checkOver,repGain:repGain,recruitPrice:recruitPrice,worth:worth,saleValue:saleValue,favorCost:function(){return G.prep?favorCost():0},kitStats:kitStats};
})();
</script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
</script>
